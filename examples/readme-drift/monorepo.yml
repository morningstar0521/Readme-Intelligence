name: README drift (base and head)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  readme-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      - name: Checkout pull request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          persist-credentials: false

      # Use the checker from base so the pull request cannot change the judging code.
      # Update the pin to the reviewed release commit when a tagged release is available.
      - uses: morningstar0521/Readme-Intelligence/.github/actions/readme-drift@91447c4
        with:
          head-path: head
          base-path: base
          readme-path: README.md
          fail-on: new-contradiction
          repo: ${{ github.repository }}
          ref: ${{ github.event.pull_request.head.sha }}
