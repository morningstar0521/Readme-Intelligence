name: README drift

# On every pull request: run the Repository Reality Check on the base branch and on the PR,
# post (or update) one comment listing contradictions the PR introduces or resolves, and
# fail the check when the PR adds a new README contradiction.
# Static only: nothing from the PR is installed or executed; files are read as text.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: readme-drift-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      # The tool itself always comes from the base branch, so a PR cannot change the checker that judges it.
      - name: Checkout base (tool + base files)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      - name: Checkout PR head (files only)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: base/pnpm-lock.yaml

      # The PR that first adds this workflow has no checker on its base branch yet: skip, do not fail.
      - name: Checker available on base?
        id: tool
        run: |
          if [ -f base/scripts/reality.ts ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; echo "Base branch has no scripts/reality.ts yet; skipping." >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Reality check (PR vs base)
        id: reality
        if: steps.tool.outputs.ok == 'true'
        continue-on-error: true
        uses: ./base/.github/actions/readme-drift
        with:
          head-path: head
          base-path: base
          fail-on: new-contradiction
          repo: ${{ github.repository }}
          ref: ${{ github.event.pull_request.head.sha }}

      # Fork PRs get a read-only token, so commenting can fail there; the job summary still has the report.
      - name: Comment on the pull request
        if: always() && steps.reality.outputs.report_path != ''
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('${{ steps.reality.outputs.report-path }}', 'utf8');
            const marker = '<!-- readme-intelligence:reality-check -->';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const mine = comments.find((c) => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

      - name: Fail on new contradictions
        if: steps.tool.outputs.ok == 'true' && steps.reality.outputs.exit_code == '1'
        run: |
          echo "The PR introduces a README contradiction. See the job summary or the PR comment."
          exit 1

      - name: Fail on checker errors
        if: steps.tool.outputs.ok == 'true' && steps.reality.outcome == 'failure' && steps.reality.outputs.exit_code != '1'
        run: |
          echo "README Reality Check failed to run. See the job summary for details."
          exit 1
